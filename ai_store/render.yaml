services:
  # ------------------------------------------------------------------
  # WEB SERVICE — Daphne (ASGI, handles HTTP + WebSockets via Channels)
  # ------------------------------------------------------------------
  - type: web
    name: ai-store-web
    runtime: python
    plan: starter
    region: singapore          # change to your preferred Render region
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "daphne -b 0.0.0.0 -p $PORT ai_store.asgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: ai-store-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ai-store-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: ai-store-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: ai-store-redis
          property: connectionString
      # --- secrets you must fill in manually in the Render dashboard ---
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

  # ------------------------------------------------------------------
  # WORKER SERVICE — Celery (background tasks: emails, order processing, etc.)
  # ------------------------------------------------------------------
  - type: worker
    name: ai-store-celery-worker
    runtime: python
    plan: starter
    region: singapore
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A ai_store worker --loglevel=info"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        sync: false           # set the SAME value as the web service's SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: ai-store-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ai-store-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: ai-store-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: ai-store-redis
          property: connectionString
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

  # ------------------------------------------------------------------
  # (OPTIONAL) BEAT SERVICE — only needed if you use scheduled/periodic tasks
  # ------------------------------------------------------------------
  # - type: worker
  #   name: ai-store-celery-beat
  #   runtime: python
  #   plan: starter
  #   region: singapore
  #   buildCommand: "pip install -r requirements.txt"
  #   startCommand: "celery -A ai_store beat --loglevel=info"
  #   envVars:
  #     (same envVars block as ai-store-celery-worker above)

  # ------------------------------------------------------------------
  # REDIS — used by both Channels (WebSocket layer) and Celery (broker)
  # ------------------------------------------------------------------
  - type: redis
    name: ai-store-redis
    plan: starter
    region: singapore
    ipAllowList: []            # empty = only accessible from your Render services

databases:
  # ------------------------------------------------------------------
  # POSTGRES
  # ------------------------------------------------------------------
  - name: ai-store-db
    plan: starter
    region: singapore
    databaseName: ai_store_db
    user: ai_store_user
