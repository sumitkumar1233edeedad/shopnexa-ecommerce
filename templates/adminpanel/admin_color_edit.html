{% extends "adminpanel/admin_base.html" %}

{% block title %}Edit Color{% endblock %}

{% block content %}

<section class="page-header">
    <div>
        <h1>Edit Color</h1>
        <p>Update {{ color.name }}.</p>
    </div>
</section>

<section class="content-card">

    <form method="post" class="admin-form">
        {% csrf_token %}

        <div class="form-grid">

            <div class="form-group">
                <label for="name">Color Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ color.name }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="hex_code">Hex Code</label>

                <input
                    type="text"
                    id="hex_code"
                    name="hex_code"
                    value="{{ color.hex_code }}"
                    maxlength="7"
                >
            </div>

        </div>

        <div class="form-actions">

            <a
                href="{% url 'admin_colors' %}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="btn btn-primary"
            >
                Update Color
            </button>

        </div>

    </form>

</section>

{% endblock %}
