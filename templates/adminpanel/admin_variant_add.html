{% extends "adminpanel/admin_base.html" %}

{% block title %}Add Variant{% endblock %}

{% block content %}

<section class="page-header">
    <div>
        <h1>Add Variant</h1>
        <p>Add a variant to an existing product.</p>
    </div>
</section>

<section class="content-card">

    <form method="post" class="admin-form">
        {% csrf_token %}

        <div class="form-grid">

            <!-- Product -->
            <div class="form-group">
                <label>Product</label>

                <select name="product" required>
                    <option value="">Select product</option>

                    {% for product in products %}
                        <option value="{{ product.slug }}">
                            {{ product.name }}
                        </option>
                    {% endfor %}

                </select>
            </div>

            <!-- SKU -->
            <div class="form-group">
                <label>SKU</label>
                <input name="sku" required>
            </div>

            <!-- Size -->
            <div class="form-group">
                <label>Size</label>
                <input name="size">
            </div>

            <!-- Color -->
            <div class="form-group">
                <label>Color</label>

                <select name="color">
                    <option value="">Select color</option>

                    {% for color in colors %}
                        <option value="{{ color.slug }}">
                            {{ color.name }}
                        </option>
                    {% endfor %}

                </select>
            </div>

            <!-- Price -->
            <div class="form-group">
                <label>Price</label>
                <input
                    name="price"
                    type="number"
                    step="0.01"
                    min="0"
                    required
                >
            </div>

            <!-- Stock -->
            <div class="form-group">
                <label>Stock</label>
                <input
                    name="stock"
                    type="number"
                    min="0"
                    value="0"
                >
            </div>

            <!-- Active Status -->
            <div class="form-group full">
                <label class="checkbox">
                    <input
                        name="is_active"
                        type="checkbox"
                        checked
                    >
                    Active variant (available for purchase)
                </label>
            </div>

        </div>

        <div class="form-actions">

            <a
                href="{% url 'admin_variants' %}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="btn btn-primary"
            >
                Create Variant
            </button>

        </div>

    </form>

</section>

{% endblock %}
