<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f8fafc;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 540px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
        }

        .header {
            background: linear-gradient(135deg, #4f46e5, #312e81);
            color: white;
            padding: 32px 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 26px;
        }

        .content {
            padding: 32px 24px;
            text-align: center;
            color: #1e293b;
        }

        .discount-banner {
            background: #ecfdf5;
            color: #047857;
            font-size: 24px;
            font-weight: 800;
            padding: 12px 24px;
            border-radius: 8px;
            display: inline-block;
            margin-bottom: 20px;
        }

        .code-box {
            background: #f8fafc;
            border: 2px dashed #6366f1;
            border-radius: 8px;
            padding: 14px 20px;
            margin: 15px auto 25px;
            max-width: 320px;
        }

        .code {
            font-family: monospace;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 4px;
            color: #4338ca;
        }

        .details-list {
            list-style: none;
            padding: 0;
            margin: 0 0 25px;
            font-size: 14px;
            color: #64748b;
            line-height: 1.8;
        }

        .btn-shop {
            display: inline-block;
            background: #4f46e5;
            color: #ffffff !important;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
        }

        .footer {
            background: #f1f5f9;
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Special Promotion for You!</h1>
    </div>

    <div class="content">

        <p style="font-size: 16px; margin-bottom: 15px;">
            Hello <strong>{{ user_name }}</strong>,
        </p>

        <div class="discount-banner">
            {{ discount_text }}
        </div>

        <p style="color: #475569; font-size: 15px;">
            Enjoy special savings on your next purchase at AI Store!
        </p>

        <div class="code-box">
            <span class="code">
                {{ coupon.code }}
            </span>
        </div>

        <ul class="details-list">

            <li>
                ✓ Minimum cart value:
                <strong>₹{{ minimum_order_amount }}</strong>
            </li>

            <li>
                ✓ Valid until:
                <strong>{{ valid_until }}</strong>
            </li>

        </ul>

        <div>
            <a href="{{ site_url }}/" class="btn-shop">
                Shop Now & Apply →
            </a>
        </div>

    </div>

    <div class="footer">
        &copy; 2026 AI Store. All rights reserved.
    </div>

</div>

</body>
</html>
