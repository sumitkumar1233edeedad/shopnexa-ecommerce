<div class="profile-card">
  <div class="card-header">
    <h2>Quick Dashboard</h2>
  </div>

  <div class="account-links">
    <!-- My Orders -->
    <a href="{% url 'my_orders' %}">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent);"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
      <div>
        <strong>My Orders</strong>
        <small>{{ recent_orders.count }} recent order{{ recent_orders.count|pluralize }}</small>
      </div>
    </a>

    <!-- Wishlist -->
    <a href="{% url 'wishlist' %}">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent);"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
      <div>
        <strong>Wishlist</strong>
        <small>Saved items</small>
      </div>
    </a>

    <!-- Addresses -->
    <a href="#saved-addresses-section">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent);"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
      <div>
        <strong>Saved Addresses</strong>
        <small>{{ addresses.count }} address{{ addresses.count|pluralize:"es" }}</small>
      </div>
    </a>

    <!-- Cart -->
    <a href="{% url 'cart' %}">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent);"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      <div>
        <strong>Cart</strong>
        <small>View items</small>
      </div>
    </a>
  </div>
</div>
