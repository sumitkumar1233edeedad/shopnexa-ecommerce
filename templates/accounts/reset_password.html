{% extends 'base.html' %}
{% block content %}

<div class="account_login_page">

    <div class="account_login_container" style="max-width: 440px;">

        <div class="account_login_header">
            <div style="font-size: 40px; margin-bottom: 10px;">🛡️</div>
            <h1 class="account_login_title">
                Set New Password
            </h1>

            <p class="account_login_subtitle">
                Please create a strong password of at least 6 characters.
            </p>
        </div>

        {% if messages %}
            <div class="account_messages">
                {% for message in messages %}
                    <p class="account_message">
                        {{ message }}
                    </p>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST" action="{% url 'reset_password' %}" class="account_login_form">
            {% csrf_token %}

            <div class="account_form_group">
                <label class="account_form_label">
                    New Password
                </label>

                <input
                    type="password"
                    name="new_password"
                    minlength="6"
                    class="account_form_input"
                    placeholder="Enter new password (min 6 characters)"
                    required
                    autofocus
                >
            </div>

            <div class="account_form_group">
                <label class="account_form_label">
                    Confirm New Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    minlength="6"
                    class="account_form_input"
                    placeholder="Confirm new password"
                    required
                >
            </div>

            <button type="submit" class="account_login_button">
                Update Password
            </button>
        </form>

        <div class="account_login_footer" style="margin-top: 20px; text-align: center;">
            <p class="account_footer_text">
                <a href="{% url 'login' %}" class="account_link">
                    ← Back to Login
                </a>
            </p>
        </div>

    </div>

</div>

{% endblock %}
